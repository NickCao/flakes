[package]
name = "meow"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true

[dependencies]
axum = "0.8.9"
tower-http = { version = "0.7.1", features = [ "fs", "limit" ] }
rand = "0.10.3"
futures = "0.3.34"
tokio = { version = "1.53.2", features = [ "full" ] }
tokio-util = { version = "0.7.20", features = [ "compat" ] }
url = "2.5.8"
argh = "0.1.19"
lazy_static = "1.5.1"
infer = "0.22.0"
